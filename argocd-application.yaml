apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tech-challenge-2
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/folsedo/tech-challenge-2.git
    targetRevision: main
    path: helm/tech-challenge-2
    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true